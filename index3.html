<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Expensive Form</title>
</head>
<body>
    <h3>Add New Expensive</h3>
    <form>
        <label>Form Name:</label>
        <input type="text"><br><br>
        <label>Expensive Amount:</label>
        <input type="number"><br><br>
        <label>Description:</label>
        <input type="text"><br><br>
        <label>Expensive Date:</label>
        <input type="date"><br><br>
        <label for="select category">Select Category:</label>
        <select name="category" id="category">
            <option value="Select Category">select category</option>
            <option value="food">food</option>
            <option value="travel">travel</option>
            <option value="shopping">shopping</option>
            <option value="education">education</option>
            <option value="bills">bills</option>
            <option value="other">other</option>
        </select><br><br>
        <label for="payment">Payment Method:</label>
        <select name="payment" id="payment">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
            <option value="debit-card">Debit Card</option>
            <option value="credit-card">Credit Card</option>
            <option value="net-banking">Net Banking</option>

        </select><br><br>
        <label for="notes">Additional Notes:</label><br><br>
        <textarea name="notes" id="notes" rows="4" cols="30" placeholder="write your notes"></textarea><br><br>
        <button>Submit Expenses</button>

        

    </form>
    
</body>
</html>
